<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h2>Create Account</h2>
      <p>Join ShopApp today! It's quick and easy.</p>
    </div>
    
    <form #registerForm="ngForm" (ngSubmit)="onRegister()">
      <div class="form-floating mb-3">
        <input type="text" name="fullName" class="form-control" id="regFullName" placeholder="Full Name" 
               [(ngModel)]="registerData.fullName" required #fullNameVal="ngModel"
               [class.is-invalid]="fullNameVal.invalid && fullNameVal.touched">
        <label for="regFullName">Full Name</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text" name="username" class="form-control" id="regUsername" placeholder="Username" 
               [(ngModel)]="registerData.username" required #userVal="ngModel"
               [class.is-invalid]="userVal.invalid && userVal.touched">
        <label for="regUsername">Username</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" name="email" class="form-control" id="regEmail" placeholder="name@example.com" 
               [(ngModel)]="registerData.email" required email #emailVal="ngModel"
               [class.is-invalid]="emailVal.invalid && emailVal.touched">
        <label for="regEmail">Email address</label>
      </div>
      
      <div class="form-floating mb-4">
        <input type="password" name="password" class="form-control" id="regPassword" placeholder="Password" 
               [(ngModel)]="registerData.password" required minlength="6" #passVal="ngModel"
               [class.is-invalid]="passVal.invalid && passVal.touched">
        <label for="regPassword">Password</label>
        <div class="form-text">Minimum 6 characters</div>
      </div>
      
      <button type="submit" class="btn btn-primary btn-login w-100" [disabled]="!registerForm.valid">
        <span>Register</span>
        <i class="bi bi-check-circle"></i>
      </button>
      
      <div class="mt-4 text-center">
        <p class="mb-0">Already have an account? <a routerLink="/login" class="text-primary fw-bold">Login</a></p>
      </div>
    </form>
  </div>
</div>
