<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <i class="bi bi-cart-fill"></i>
      </div>
      <h2>ShopApp</h2>
      <p>Welcome back! Please login to your account.</p>
    </div>
    
    <form #loginForm="ngForm" (ngSubmit)="onLogin()">
      <div class="form-floating mb-3">
        <input type="email" name="email" class="form-control" id="floatingEmail" placeholder="name@example.com" 
               [(ngModel)]="loginData.email" required #emailVal="ngModel"
               [class.is-invalid]="emailVal.invalid && emailVal.touched">
        <label for="floatingEmail">Email address</label>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>
      
      <div class="form-floating mb-4">
        <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" 
               [(ngModel)]="loginData.password" required #passVal="ngModel"
               [class.is-invalid]="passVal.invalid && passVal.touched">
        <label for="floatingPassword">Password</label>
        <div class="invalid-feedback">Password is required.</div>
      </div>
      
      <button type="submit" class="btn btn-primary btn-login w-100" [disabled]="!loginForm.valid">
        <span>Login</span>
        <i class="bi bi-arrow-right"></i>
      </button>
      
      <div class="mt-4 text-center">
        <p class="mb-0">Don't have an account? <a routerLink="/register" class="text-primary fw-bold">Register Now</a></p>
      </div>
    </form>
  </div>
</div>
