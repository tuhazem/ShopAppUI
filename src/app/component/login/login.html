<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-4 text-primary">Supermarket POS</h3>
    <form #loginForm="ngForm" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" [(ngModel)]="loginData.email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" [(ngModel)]="loginData.password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="!loginForm.valid">Login</button>
    </form>
  </div>
</div>
