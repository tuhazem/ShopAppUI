<div class="cinematic-container animate-in">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <h1 class="display-1 fw-extrabold">Shop<span class="text-primary-gradient">App</span></h1>
      <p class="lead text-secondary-v2">Your Premium Destination for Quality Products</p>
      <div class="hero-stats">
        <div class="stat-item">
          <span class="stat-value">{{ totalCount }}+</span>
          <span class="stat-label">Products</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value">24/7</span>
          <span class="stat-label">Support</span>
        </div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary-v2" (click)="loadProducts()">Explore Inventory</button>
        <button class="btn btn-outline-v2" (click)="downloadInventory()">
          <i class="bi bi-download me-2"></i> Report
        </button>
      </div>
    </div>
    <div class="hero-overlay"></div>
  </section>

  <!-- Inventory Grid -->
  <section class="inventory-section py-5">
    <div class="section-header mb-5">
      <div class="search-bar-v2">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Search our premium collection..." 
               [ngModel]="searchTerm" (ngModelChange)="onSearch($event)">
      </div>
    </div>

    <div class="row g-4">
      <div class="col-sm-6 col-md-4 col-xl-3" *ngFor="let p of products">
        <div class="product-card-v2">
          <div class="card-image-wrapper">
            <div class="product-badge">{{ p.categoryName }}</div>
            <div class="stock-status" [class.low-stock]="p.stock < 10">
              {{ p.stock }} left
            </div>
            <i class="bi bi-box-seam card-icon"></i>
          </div>
          
          <div class="card-content">
            <h5 class="product-title">{{ p.name }}</h5>
            <p class="product-desc">{{ p.description }}</p>
            <div class="price-section">
              <span class="currency">EGP</span>
              <span class="price-value">{{ p.price }}</span>
            </div>
            <button class="btn order-btn-v2" (click)="quickOrder(p)" [disabled]="p.stock <= 0">
              <i class="bi bi-cart-plus-fill me-2"></i> {{ p.stock > 0 ? 'Order Now' : 'Out of Stock' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination-v2 mt-5" *ngIf="totalPages > 1">
      <button class="pag-btn" (click)="changePage(pageNumber - 1)" [disabled]="pageNumber === 1">
        <i class="bi bi-arrow-left"></i>
      </button>
      <div class="pag-info">
        Page <span class="current">{{ pageNumber }}</span> of {{ totalPages }}
      </div>
      <button class="pag-btn" (click)="changePage(pageNumber + 1)" [disabled]="pageNumber === totalPages">
        <i class="bi bi-arrow-right"></i>
      </button>
    </div>
  </section>
</div>
