<div class="login-wrapper">
  <!-- Glowing background blobs -->
  <div class="bg-glow blob-1"></div>
  <div class="bg-glow blob-2"></div>

  <div class="login-card glass-card">
    <div class="login-header">
      <div class="logo-container">
        <div class="logo-icon">
          <i class="bi bi-cart4"></i>
        </div>
      </div>
      <h2 class="text-mono">ShopUI</h2>
      <p class="text-secondary text-sm">Welcome back. Enter your credentials to access the console.</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()" autocomplete="off">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-envelope"></i>
          <input type="email" id="email" name="email" class="input-premium" 
                 placeholder="name@example.com" [(ngModel)]="loginData.email" 
                 required email #emailVal="ngModel" [disabled]="isLoading"
                 [class.is-invalid]="emailVal.invalid && emailVal.touched">
        </div>
        @if (emailVal.invalid && emailVal.touched) {
          <div class="error-message text-xs">Please enter a valid email address.</div>
        }
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label for="password" class="form-label">Password</label>
        </div>
        <div class="input-icon-wrapper">
          <i class="bi bi-shield-lock"></i>
          <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" 
                 class="input-premium" placeholder="••••••••" [(ngModel)]="loginData.password" 
                 required #passVal="ngModel" [disabled]="isLoading"
                 [class.is-invalid]="passVal.invalid && passVal.touched">
          <button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()" 
                  [disabled]="isLoading" [title]="showPassword ? 'Hide password' : 'Show password'">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
        @if (passVal.invalid && passVal.touched) {
          <div class="error-message text-xs">Password is required.</div>
        }
      </div>

      <button type="submit" class="btn-premium btn-primary-v2 w-100 mt-2" 
              [disabled]="!loginForm.valid || isLoading">
        @if (isLoading) {
          <div class="spinner spinner-sm"></div>
          <span>Authenticating...</span>
        } @else {
          <span>Sign In</span>
          <i class="bi bi-arrow-right-short"></i>
        }
      </button>

      <div class="card-footer mt-2">
        <p class="text-secondary text-sm">
          New developer? 
          <a routerLink="/register" class="text-accent fw-600">Create account</a>
        </p>
      </div>
    </form>
  </div>
</div>
