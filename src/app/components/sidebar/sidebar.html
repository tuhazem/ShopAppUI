@if (accountService.isLoggedIn()) {
  <aside class="sidebar-container">
    <div class="brand-section">
      <div class="brand-icon">
        <i class="bi bi-cart4"></i>
      </div>
      <div class="brand-details">
        <span class="brand-name">ShopUI</span>
        <span class="brand-badge">ERP</span>
      </div>
    </div>

    <nav class="nav-links">
      <a routerLink="/home" routerLinkActive="active" class="nav-item" title="Inventory">
        <i class="bi bi-grid-1x2-fill"></i>
        <span class="nav-text text-mono">Inventory</span>
      </a>

      <a routerLink="/orders" routerLinkActive="active" class="nav-item" title="Orders">
        <i class="bi bi-receipt"></i>
        <span class="nav-text text-mono">Orders</span>
      </a>

      <a routerLink="/customers" routerLinkActive="active" class="nav-item" title="Customers">
        <i class="bi bi-people-fill"></i>
        <span class="nav-text text-mono">Customers</span>
      </a>

      @if (accountService.isAdmin()) {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" title="Dashboard">
          <i class="bi bi-speedometer2"></i>
          <span class="nav-text text-mono">Analytics</span>
        </a>
      }
    </nav>

    <div class="user-section">
      <div class="user-info">
        <div class="user-avatar" [title]="accountService.getUsername()">
          {{ accountService.getUsername().charAt(0).toUpperCase() }}
        </div>
        <div class="user-details">
          <span class="user-name">{{ accountService.getUsername() }}</span>
          <span class="user-role text-mono">
            {{ accountService.isAdmin() ? 'Admin' : 'Staff' }}
          </span>
        </div>
      </div>
      <button class="logout-btn" (click)="onLogout()" title="Logout">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </aside>
}
